# 只读镜像机制的仓库侧取值。放在仓库根，命名 .mirror.conf，入 Git。
#
# 这里的每一项都是全项目一致的值：它们决定哪些文件算镜像内容，而 CI 与
# check-docs-mirror.sh 读的就是这一份。本机才有的取值（vault 在哪）不在这儿，
# 见 .mirror.conf.local。
#
# 这份文件被 shell source，所以是 KEY=值 的写法，值里有空格要加引号。

# 镜像装在哪，相对仓库根。这个目录由 sync-docs.sh 全权管理（rsync --delete），
# 不要往里放任何不是从 vault 来的东西。
MIRROR_DEST=docs/需求

# vault 根目录不在这份文件里：它是一条本机绝对路径，每台机器不同，而这份配置入 Git。
# 它在 .mirror.conf.local（不入 Git，每人一份）的 MIRROR_VAULT_ROOT。
# MIRROR_VAULT_DOCS（完整路径，给了它就不看根与子路径）同样属于那一侧。
#
# vault 里哪个子目录是源，相对那个根。留空表示整个 vault 根就是源。
# 值里有空格必须加引号——这份文件是被 shell source 的，裸空格会把值截断。
MIRROR_VAULT_SUBPATH="产品/需求"

# 进镜像的扩展名，空格分隔。默认只有 md。
# 多收一类就多一类「vault 里删了、镜像跟着被 --delete 清掉」的东西。
MIRROR_TYPES="md"

# 只读横幅的模板，相对仓库根；留空表示不注入横幅。
# 模板里的 {{UP}} 会替换成从当前文件回到镜像父目录的相对前缀。
# 不要把它放在 MIRROR_DEST 里面——那儿的东西每次同步都会被 --delete 清掉。
MIRROR_BANNER=docs/.mirror-banner.md

# rsync 要排除的路径，写成数组。相对 vault 源目录，前导斜杠表示只匹配顶层。
# vault 侧指回本仓库的软链一定要列进来：rsync 一旦加了 -L，会顺着它把仓库
# 自己抄进镜像。靠"它不是 .md 所以会被兜住"是碰运气——往那儿放一篇 .md 就漏。
MIRROR_EXCLUDES=(/开发)

# 下面两项都有默认值，不用管。只在默认值不合用时才取消注释——注意取消之后
# 要跟着改 .gitignore 里忽略备份目录的那条 pattern。
#
# 基线文件，默认 <MIRROR_DEST>.manifest
# MIRROR_MANIFEST=
#
# 手改备份的目录前缀，默认 <镜像父目录>/.<镜像目录名>-手改备份-
# MIRROR_BACKUP_PREFIX=
